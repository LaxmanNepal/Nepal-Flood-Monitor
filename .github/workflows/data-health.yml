name: Flood data health check

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate published data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          flood = json.loads(Path('data/flood-data.json').read_text())
          health = json.loads(Path('data/source-health.json').read_text())

          stations = flood.get('stations', [])
          if not isinstance(stations, list):
              raise SystemExit('stations must be a list')

          valid = 0
          for s in stations:
              lat = s.get('latitude')
              lon = s.get('longitude')
              level = s.get('water_level')
              if lat is None or lon is None:
                  continue
              if not (-90 <= float(lat) <= 90 and -180 <= float(lon) <= 180):
                  raise SystemExit(f'Invalid coordinates for {s.get("station_name")}')
              if level is not None:
                  float(level)
              valid += 1

          status = health.get('status')
          if status not in {'LIVE', 'STALE', 'ERROR', 'UNAVAILABLE'}:
              raise SystemExit(f'Invalid source health status: {status}')

          print(f'Stations: {len(stations)}; coordinate-valid: {valid}; source: {status}')
          PY
