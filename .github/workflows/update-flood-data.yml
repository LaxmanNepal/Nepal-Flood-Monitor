name: Update flood data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser collector
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Fetch complete DHM River Watch
        run: python scripts/update_flood_data.py

      - name: Validate generated JSON
        run: |
          python -m json.tool data/flood-data.json >/dev/null
          python -m json.tool data/source-health.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/flood-data.json').read_text())
          n=len(d.get('stations', []))
          print(f'Published river stations: {n}')
          if n < 20:
              raise SystemExit('Too few river stations; refusing deployment data')
          if d.get('data_status') not in {'LIVE','LIVE_PARTIAL'}:
              raise SystemExit(f"Invalid data status: {d.get('data_status')}")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flood-data.json data/source-health.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): update complete DHM river statuses"
            git push
          fi
