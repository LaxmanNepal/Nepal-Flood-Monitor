name: Update flood data

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-flood-data.yml"
      - "scripts/update_flood_data.py"
      - "data/stations.json"
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: flood-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          check-latest: true

      - name: Fetch government flood data
        run: python scripts/update_flood_data.py

      - name: Update rolling station history
        run: python scripts/update_station_history.py

      - name: Validate published snapshot
        run: |
          python -m json.tool data/flood-data.json >/dev/null
          python -m json.tool data/source-health.json >/dev/null
          python -m json.tool data/station-history.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/flood-data.json').read_text())
          h=json.loads(Path('data/source-health.json').read_text())
          stations=d.get('stations', [])
          if not isinstance(stations, list) or len(stations) < 20:
              raise SystemExit(f'Invalid station count: {len(stations) if isinstance(stations,list) else "not a list"}')
          if d.get('data_status') not in {'LIVE','LIVE_PARTIAL','STALE'}:
              raise SystemExit(f"Invalid data status: {d.get('data_status')}")
          coords=[s for s in stations if isinstance(s,dict) and 26 <= float(s.get('latitude', -999)) <= 31 and 80 <= float(s.get('longitude', -999)) <= 89]
          if len(coords) < max(20, int(len(stations) * 0.80)):
              raise SystemExit(f"Insufficient Nepal station coordinates: {len(coords)}/{len(stations)}")
          if h.get('status') not in {'LIVE','LIVE_PARTIAL','STALE','ERROR','UNAVAILABLE'}:
              raise SystemExit(f"Invalid source health status: {h.get('status')}")
          hist=json.loads(Path('data/station-history.json').read_text())
          if not isinstance(hist.get('stations'),dict):
              raise SystemExit('Invalid station history structure')
          print(f"Stations: {len(stations)} | history: {len(hist.get('stations',{}))} | data: {d.get('data_status')} | source: {h.get('status')}")
          PY

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flood-data.json data/source-health.json data/station-history.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): update river status snapshot"
            git push
          fi
