name: Update flood data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch DHM data
        run: python scripts/update_flood_data.py

      - name: Validate generated JSON
        run: |
          python -m json.tool data/flood-data.json >/dev/null
          python -m json.tool data/source-health.json >/dev/null

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flood-data.json data/source-health.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): update DHM flood observations"
            git push
          fi
