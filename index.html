<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7fafc"><meta name="description" content="Nepal Flood Early Warning — real-time river monitoring dashboard."><title>Nepal Flood Early Warning</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="./assets/css/style.css"></head><body><main class="app-shell">
<header class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div><div><h1>Nepal Flood Early Warning</h1><p><strong id="station-count">0</strong> live monitoring stations</p></div></div><div id="overall-status" class="status-pill"><i></i><span>0 Reporting</span></div></header>
<section class="actionbar"><div class="language"><button class="active" data-lang="en">EN</button><button data-lang="np">NP</button></div><div class="updated">Last updated <strong id="last-updated">—</strong></div><button id="refresh" class="refresh" type="button">↻ Refresh</button><a class="operator" href="#" onclick="return false">Operator Login</a></section>
<section class="filters"><select id="basin-filter" aria-label="Filter by basin"><option value="">All basins</option></select><label class="search"><span>⌕</span><input id="station-search" type="search" placeholder="Search station name..." autocomplete="off"></label></section>
<section class="map-wrap"><div id="map"></div><div class="map-tools top-right"><div class="view-toggle"><button class="active" data-layer="base">Map</button><button data-layer="satellite">Satellite</button><button data-layer="rivers">Rivers</button></div><button id="locate" class="location-warning" type="button">⌖ <span id="location-text">Use my location</span></button></div><div class="legend card"><div class="legend-title">RISK LEVEL</div><div class="legend-item"><i class="dot normal"></i>Normal <b id="legend-normal">0</b></div><div class="legend-item"><i class="dot watch"></i>Watch <b id="legend-watch">0</b></div><div class="legend-item"><i class="dot warning"></i>Warning <b id="legend-warning">0</b></div><div class="legend-item"><i class="dot critical"></i>Critical <b id="legend-critical">0</b></div><div class="legend-item"><i class="dot offline"></i>Offline <b id="legend-offline">0</b></div></div><button id="active-filter" class="filter-chip" type="button" hidden></button></section>
<section class="station-panel"><div class="panel-head"><div><p class="eyebrow">LIVE MONITORING</p><h2>River stations</h2></div><span id="result-count">0 stations</span></div><div id="station-list" class="station-list"><div class="empty-state">Loading DHM observations…</div></div></section>
</main><div id="toast" class="toast" role="status"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="./assets/js/app.js"></script></body></html>
